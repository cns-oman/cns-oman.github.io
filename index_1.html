<style>
/* ==========================================================================
   SPMS Field · CNS Middle East — a phone-first field app.
   Crimson (the CNS tile) is the one bold colour: the home card, primary buttons, the active tab.
   Steel grey (the hook) and white (the crescent) carry everything else. Outfit echoes the round CNS letters.
   ========================================================================== */
:root {
  --crimson: #B0282C; --crimson-hi: #C93339; --crimson-deep: #7E1B1F;
  --steel: #A8ACAC;
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --fill: #EFF1F4;            /* inputs, tonal buttons, tracks */
  --line: #E3E6EA;
  --line-2: #EEF0F3;
  --ink: #16171B;
  --ink-2: #5A5D65;
  --ink-3: #8B8F97;
  --brand: #B0282C; --brand-2: #962226; --brand-ink: #FFFFFF; --brand-soft: #FCEDED; --brand-on: #A3242A;
  --plate: #4F5157; --plate-ink: #FFFFFF;
  --ok: #18915A; --ok-soft: #E4F6EC;
  --warn: #C27400; --warn-soft: #FFF2DE;
  --bad: #E0453F; --bad-soft: #FDECEB;
  --info: #2F6BDE; --info-soft: #E9F0FD;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #e6e8ec;   /* chart series (validated for colour-blind readers) */
  --hero: radial-gradient(120% 140% at 100% 0%, #D23C42 0%, rgba(210,60,66,0) 55%), linear-gradient(150deg, #B9292E 0%, #A02428 50%, #7E1B1F 100%);
  --e1: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px -10px rgba(16,24,40,.14);
  --e2: 0 2px 6px rgba(16,24,40,.05), 0 20px 40px -18px rgba(16,24,40,.28);
  --e-brand: 0 10px 22px -10px rgba(176,40,44,.65);
  --font-display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 20px; --r-sm: 14px;
  --shadow: var(--e1); --shadow-lg: var(--e2); --spark: var(--crimson); --spark-soft: var(--brand-soft);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1013; --surface: #1A1B1F; --surface-2: #202126; --fill: #26272D; --line: #33353B; --line-2: #26282D;
  --ink: #F1F2F4; --ink-2: #B4B7BE; --ink-3: #8A8E96; --brand: #DA4349; --brand-2: #E5585E; --brand-soft: #3A1B1E; --brand-on: #FF9EA2;
  --plate: #5A5C63; --ok: #4CCB8A; --ok-soft: #13301F; --warn: #F2AE4C; --warn-soft: #33260F; --bad: #FF7069; --bad-soft: #3B1A18; --info: #82AEFF; --info-soft: #172A4A;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #2e3036;
  --hero: radial-gradient(120% 140% at 100% 0%, #B3343A 0%, rgba(179,52,58,0) 55%), linear-gradient(150deg, #8E2125 0%, #6E191D 55%, #4A1013 100%);
  --e1: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6); --e2: 0 2px 6px rgba(0,0,0,.5), 0 22px 44px -16px rgba(0,0,0,.8); --e-brand: 0 10px 22px -10px rgba(0,0,0,.7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1013; --surface: #1A1B1F; --surface-2: #202126; --fill: #26272D; --line: #33353B; --line-2: #26282D;
  --ink: #F1F2F4; --ink-2: #B4B7BE; --ink-3: #8A8E96; --brand: #DA4349; --brand-2: #E5585E; --brand-soft: #3A1B1E; --brand-on: #FF9EA2;
  --plate: #5A5C63; --ok: #4CCB8A; --ok-soft: #13301F; --warn: #F2AE4C; --warn-soft: #33260F; --bad: #FF7069; --bad-soft: #3B1A18; --info: #82AEFF; --info-soft: #172A4A;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #2e3036;
  --hero: radial-gradient(120% 140% at 100% 0%, #B3343A 0%, rgba(179,52,58,0) 55%), linear-gradient(150deg, #8E2125 0%, #6E191D 55%, #4A1013 100%);
  --e1: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6); --e2: 0 2px 6px rgba(0,0,0,.5), 0 22px 44px -16px rgba(0,0,0,.8); --e-brand: 0 10px 22px -10px rgba(0,0,0,.7);
  color-scheme: dark; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); }
.mono { font-family: var(--font-mono); font-size: .84em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- frame ---------- */
#stage { height: 100%; display: flex; }
#phone { flex: 1; min-width: 0; height: 100%; display: flex; }
.app { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; background: var(--bg); overflow: hidden; }

/* top bar: CNS tile, page title, you */
.bar { flex: none; position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 14px 18px 8px; background: var(--bg); }
.bar .wm { display: none; }
.logo { width: 34px; height: 42px; display: grid; place-items: center; flex: none; }
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.bar .ttl { flex: 1; min-width: 0; }
.bar .ttl small { display: block; font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .ttl b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 25px; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.helpb { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink-2); flex: none; display: grid; place-items: center; cursor: pointer; margin-left: auto; }
.helpb .ic { width: 22px; height: 22px; }
.helpb + .avatar { margin-left: 8px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--brand-soft); color: var(--brand-on); font-weight: 700; font-size: 14px; flex: none; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px color-mix(in srgb, var(--brand) 35%, transparent); }
.avatar.mini { width: 42px; height: 42px; box-shadow: none; }
.hsub, .hstats { display: none; }

/* screen */
.scr { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 10px 116px; padding-inline: 16px; display: flex; flex-direction: column; gap: 18px; }
.scr > * { flex: none; }
.blk { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-inline: 4px; }
.sec-h h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: -.01em; color: var(--ink); }
.sec-h .t3, .sec-h .muted { font-size: 13px; }
.note { font-size: 13.5px; color: var(--ink-3); padding-inline: 4px; margin: 0; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.pt { display: none; }

/* ---------- home: the crimson card and quick actions ---------- */
.home { position: relative; overflow: hidden; background: var(--hero); color: #fff; border-radius: 26px; padding: 20px 20px 18px; box-shadow: 0 18px 36px -18px rgba(126,27,31,.75); display: flex; flex-direction: column; gap: 4px; }
.home .wm { position: absolute; right: -34px; bottom: -48px; height: 210px; opacity: .14; pointer-events: none; }
.home .h-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }
.home .h-lab { font-size: 14px; opacity: .9; }
.home .h-role { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.16); max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home .h-num { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: -.03em; margin-top: 8px; position: relative; font-variant-numeric: lining-nums tabular-nums; }
.home .h-sub { font-size: 15px; opacity: .92; position: relative; }
.home .h-row { display: flex; gap: 8px; margin-top: 14px; position: relative; flex-wrap: wrap; }
.h-pill { border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,.16); color: #fff; font-size: 13.5px; font-weight: 500; }
.h-pill b { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-right: 4px; }
.h-pill:hover { background: rgba(255,255,255,.24); }
.qa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.qa-b { border: 0; background: none; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-align: center; line-height: 1.2; }
.qa-i { width: 58px; height: 58px; border-radius: 20px; background: var(--surface); color: var(--brand); display: grid; place-items: center; box-shadow: var(--e1); transition: transform .1s; }
.qa-b.pri .qa-i { background: linear-gradient(180deg, var(--crimson-hi), var(--brand)); color: #fff; box-shadow: var(--e-brand); }
.qa-b:active .qa-i { transform: scale(.94); }
.qa-i .ic { width: 25px; height: 25px; }
.hero { display: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; border: 0; text-align: left; box-shadow: var(--e1); }
.stat b { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.stat span { font-size: 12px; color: var(--ink-2); }
.stat.hot b { color: var(--brand); }

/* ---------- surfaces ---------- */
.card, .list, .kpi, .jcard, .alert, .tbl-wrap { background: var(--surface); border-radius: var(--r); box-shadow: var(--e1); border: 0; }
.card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.action { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--brand) 40%, transparent), var(--e2); }
.list { overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; background: none; width: 100%; text-align: left; border-top: 1px solid var(--line-2); min-height: 60px; }
.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .t1 { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .t2 { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.row .t3 { font-size: 12.5px; color: var(--ink-3); }
.row .rowbtn { border: 0; background: none; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.row > .btn { flex: none; }
.chev { color: var(--ink-3); flex: none; }
.lead { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--ink-2); }
.lead.ok { background: var(--ok-soft); color: var(--ok); } .lead.warn { background: var(--warn-soft); color: var(--warn); } .lead.bad { background: var(--bad-soft); color: var(--bad); } .lead.info { background: var(--brand-soft); color: var(--brand); }
.empty { padding: 24px 18px; text-align: center; color: var(--ink-3); font-size: 14px; }
.empty .em-ic { width: 52px; height: 52px; border-radius: 22px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin: 0 auto 12px; }
.empty b { font-family: var(--font-display); font-weight: 600; }

/* request rows: status icon · what · where it is */
.jobs { display: flex; flex-direction: column; gap: 10px; }
.jcard { display: flex; align-items: flex-start; gap: 12px; padding: 14px; text-align: left; width: 100%; transition: transform .1s ease, box-shadow .15s ease; position: relative; }
.jcard:active { transform: scale(.985); }
.jcard.mine { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--brand) 30%, transparent), var(--e1); }
.jcard.late { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--bad) 50%, transparent), var(--e1); }
.j-ic { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--ink-2); }
.j-ic.t-warn { background: var(--warn-soft); color: var(--warn); } .j-ic.t-info { background: var(--info-soft); color: var(--info); } .j-ic.t-ok { background: var(--ok-soft); color: var(--ok); } .j-ic.t-bad { background: var(--bad-soft); color: var(--bad); }
.jcard.mine .j-ic { background: linear-gradient(180deg, var(--crimson-hi), var(--brand)); color: #fff; }
.j-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.j-t1 { display: flex; align-items: baseline; gap: 8px; }
.j-t1 b { font-family: var(--font-display); font-weight: 600; font-size: 16.5px; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.when { font-size: 12px; color: var(--ink-3); flex: none; }
.j-t2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.j-t3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.jtop, .jdesc, .jmeta, .jfoot { display: none; }
.prog { display: none; }
.next { font-size: 12.5px; font-weight: 700; color: var(--brand-on); background: var(--brand-soft); padding: 4px 6px 4px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; }
.next .ic { width: 16px; height: 16px; }
.wait { font-size: 12.5px; color: var(--ink-3); }
.remline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--bad); }
.remline .ic { width: 16px; height: 16px; }

/* plates, chips */
.tag { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; background: var(--plate); color: var(--plate-ink); padding: 2px 7px; border-radius: 6px; white-space: nowrap; line-height: 1.5; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--fill); color: var(--ink-2); line-height: 1.35; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.info { background: var(--info-soft); color: var(--info); }
.chip.plain::before { display: none; }
.chip.late { background: var(--bad); color: #fff; } .chip.late::before { background: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--fill); color: var(--ink-2); }
.pill.p1 { background: var(--bad); color: #fff; }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 4px 4px; margin-inline: -4px; }
.filters button { flex: none; border: 0; background: var(--surface); border-radius: 999px; padding: 9px 15px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); box-shadow: var(--e1); }
.filters button.on { background: var(--ink); color: var(--surface); }
.filters button .n { opacity: .6; margin-left: 5px; font-weight: 500; }
.filters button .ic { width: 15px; height: 15px; vertical-align: -3px; }

/* numbers */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpis.k3 { grid-template-columns: repeat(3, 1fr); }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kpis.k4 .kpi { padding: 12px 10px; }
.kpis.k4 .v { font-size: clamp(19px, 5.6vw, 28px); }
.kpi { padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.kpi .k small { color: var(--ink-3); }
.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: clamp(21px, 6.4vw, 28px); line-height: 1.1; letter-spacing: -.02em; overflow-wrap: break-word; font-variant-numeric: lining-nums tabular-nums; }
.kpi .v small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.kpi.bad .v { color: var(--bad); } .kpi.warn .v { color: var(--warn); }

/* details & notices */
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dl.kv a { color: var(--brand-on); font-weight: 600; }
.jh-t { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -.01em; line-height: 1.25; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.fact span { display: block; font-size: 12px; color: var(--ink-3); }
.fact b { display: block; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.fact .mono { color: var(--ink); font-weight: 600; font-size: 13px; }
.alert { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.alert .main { flex: 1; min-width: 0; }
.alert b { display: block; font-weight: 700; font-size: 14.5px; }
.alert .s { font-size: 13px; color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert .btn { flex: none; }
.alert .lead { width: 40px; height: 40px; border-radius: 13px; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600; }
.okbox { background: var(--ok-soft); color: var(--ok); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.infobox { background: var(--fill); color: var(--ink-2); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; }
.infobox a { color: var(--brand-on); font-weight: 600; }
.infobox .ic { width: 17px; height: 17px; vertical-align: -4px; margin-right: 4px; }
.upd { background: var(--warn-soft); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; }
.autohint { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ok); background: var(--ok-soft); border-radius: 14px; padding: 10px 12px; }
.autohint .ic { width: 16px; height: 16px; margin-top: 1px; }

/* progress inside a request */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { position: relative; padding: 0 0 12px 30px; font-size: 14px; color: var(--ink-3); }
.steps li::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: -2px; width: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps li::after { content: ""; position: absolute; left: 2px; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); box-sizing: border-box; }
.steps li.done { color: var(--ink); }
.steps li.done::after { background: var(--ok); border-color: var(--ok); }
.steps li.done::before { background: var(--ok); }
.steps li.cur { color: var(--ink); font-weight: 700; }
.steps li.cur::after { border-color: var(--brand); border-width: 5px; }
.pbar { display: flex; flex-direction: column; gap: 7px; }

.sheet-h p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-3); }
.x { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--fill); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.sheet-b { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet-b > * { flex: none; }
.sheet-f { flex: none; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); display: flex; gap: 10px; box-shadow: 0 -10px 24px -18px rgba(0,0,0,.35); }
.sheet-f .btn { flex: 1; }
.confirm { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; font-size: 15px; font-weight: 600; }
.confirm .cbtns { display: flex; gap: 10px; }
.confirm .cbtns .btn { flex: 1; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }

/* heads-up alert: slides down from the top on every device that has SPMS open */
.heads { position: absolute; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; background: var(--surface); border-radius: 20px; box-shadow: 0 18px 40px -12px rgba(0,0,0,.45), 0 0 0 1.5px color-mix(in srgb, var(--brand) 35%, transparent); transform: translateY(calc(-100% - 30px)); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.heads.show { transform: none; }
.hd-ic { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(180deg, var(--crimson-hi), var(--brand)); color: #fff; display: grid; place-items: center; flex: none; }
.hd-main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
.hd-main b { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; display: flex; align-items: center; gap: 6px; }
.hd-main > span { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* WhatsApp hand-off */
.btn.wa { background: var(--ok); color: #fff; box-shadow: 0 10px 22px -12px rgba(24,145,90,.65); }
.infobox.nextbox { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.sentcard { align-items: center; text-align: center; gap: 8px; padding: 22px 16px; }
.sentcard .em-ic { width: 60px; height: 60px; border-radius: 22px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.sentcard > b { font-family: var(--font-display); font-size: 20px; }
.sentcard .em-ic.off { background: var(--fill); color: var(--ink-3); }
.alert.wrap .s { white-space: normal; overflow: visible; }
/* toast */
.toast { position: absolute; left: 16px; right: 16px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--surface); border-radius: 18px; padding: 14px 16px; font-weight: 500; font-size: 14.5px; box-shadow: 0 16px 40px -10px rgba(0,0,0,.5); display: flex; gap: 10px; align-items: center; transform: translateY(16px); opacity: 0; transition: all .22s; pointer-events: none; }
.app.out .toast { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-host.open ~ .toast { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; transform: translateY(-16px); }
.toast.show, .sheet-host.open ~ .toast.show { transform: none; opacity: 1; }
.toast .ic { color: #FF8F94; }

/* timelines */
.tl, .trace { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li, .trace li { position: relative; padding: 0 0 15px 26px; }
.tl li::before, .trace li::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: -6px; width: 2px; background: var(--line); }
.tl li:last-child::before, .trace li:last-child::before { display: none; }

.tl li.bad::after, .trace li.bad::after { background: var(--bad); }
.tl li.now::after, .trace li.now::after { background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.tl .t1, .trace .t1 { font-weight: 600; font-size: 14.5px; }
.tl .t2, .trace .t2 { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.tl .t3, .trace .t3 { font-size: 12px; color: var(--ink-3); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); background: var(--surface-2); padding: 10px 12px; white-space: nowrap; }
.tbl td { padding: 10px 12px; border-top: 1px solid var(--line-2); white-space: nowrap; }
.tbl td.r { text-align: right; }

.tbl tr[tabindex] { cursor: pointer; }
.tbl tr[tabindex]:focus-visible td { background: var(--brand-soft); }

.grp { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 3px; width: 100%; border: 0; background: none; padding: 2px 4px; text-align: left; }

.grp .lvs { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; max-width: 46vw; }

.lvl { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.lvl.low { background: var(--bad-soft); color: var(--bad); } .lvl.over { background: var(--warn-soft); color: var(--warn); } .lvl.ok { background: var(--ok-soft); color: var(--ok); }
/* ---------- dashboard chart (grouped columns) ---------- */
.chart { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-width: 100%; }

.ch-area { position: relative; height: 160px; display: flex; align-items: stretch; min-width: 0; }

.ch-col { flex: 1; min-width: 0; position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; padding: 0 1px; border: 0; background: none; cursor: pointer; border-radius: 6px; }

.ch-col i { width: min(9px, 28%); border-radius: 4px 4px 0 0; display: block; }

.bars { display: flex; flex-direction: column; gap: 12px; }

  .si-head { grid-column: 1; grid-row: 1 / -1; margin: 0; min-height: 100vh; border-radius: 0 44px 44px 0; justify-content: center; padding: 64px; }
  .si-head .wm { height: 440px; right: -80px; bottom: -100px; }

}

    const mn = +(p.min || {})[hub] || 0, mx = +(p.max || {})[hub] || 0, q = qtyAt(hub, p.pn);

}

/* ---------- requests ---------- */
/* Every request belongs to its technician's hub: only that hub's Team Leaders, Stock and Workshop get it.
   Someone with no hub covers every hub, and a hub with nobody in a role falls back to everyone in that role. */
function accHub(a) {
  if (!a) return '';

  const t = String(a.title || '').toUpperCase();
  for (const h of HUB_INFO) if (new RegExp('\\b' + h.code + '\\b').test(t) || t.includes(h.name.toUpperCase())) return h.code;
  return '';
}
const jobHub = j => HUBS.includes(j.hub) ? j.hub : accHub(ACC(j.techId)) || HUBS[0];
const hubCountry = h => (HUB_INFO.find(x => x.code === h) || {}).country || '';

/* who handles a hub's requests in a role: the people at that hub; if nobody there, the people in the same country;
   if nobody in that country, everyone in the role. Someone with no hub and no country (the temporary Team Leader) sees every hub. */
function inMyHub(hub, me) {
  me = me || ME(); if (!me) return false; if (me.full) return true;   /* full access: every hub */

  if (peers.some(a => accHub(a) === hub)) return h === hub;

}

  if (j.status === 'REPAIRING' && j.ws && (j.ws.byId || j.ws.by)) return { id: j.ws.byId || '', name: j.ws.by || '' };
  if (j.status === 'ATHUB' && j.ret && (j.ret.hubById || j.ret.hubBy)) return { id: j.ret.hubById || '', name: j.ret.hubBy || '' };
  return null;
}
const isOwner = (o, me) => !o || (o.id ? o.id === me.id : o.name === me.name);

  me = me || ME(); if (!me || stWho(j) !== me.role) return false;

  const ok = Array.isArray(status) ? status.includes(j.status) : j.status === status;
  if (!ok) throw E(`This request has moved on (${stLabel(j)}). Close and reopen it.`);
  if (role === 'TECH' && j.techId !== me.id) throw E('This is another technician’s request.');
  if (role !== 'TECH') {
    if (!inMyHub(jobHub(j), me)) throw E(`This request belongs to ${HUB_NAME[jobHub(j)] || jobHub(j)}.`);
    const o = stepOwner(j); if (!isOwner(o, me)) throw E(`${o.name || 'Someone else'} is handling this one.`);
  }
  return me;
}

    const j = await api.get('jobs', id); if (!j) throw E('This request no longer exists.');

document.addEventListener('click', e => {

/* drag an Excel file onto the import drop zone */
const dropZone = e => e.target && e.target.closest ? e.target.closest('.drop') : null;
document.addEventListener('dragover', e => { const z = dropZone(e); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = dropZone(e); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = dropZone(e); if (!z) return; e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { if (UI.sheet && UI.sheet.name === 'accounts') readAccountsFile(f); else if (UI.sheet && UI.sheet.name === 'machines') readMachinesFile(f); else readImportFile(f); } });
const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
document.addEventListener('keydown', e => {

  if (e.key === 'Tab' && UI.sheet) {
    const host = $('#sheet'), fs = [...host.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null || x === document.activeElement); if (!fs.length) return;
    const first = fs[0], last = fs[fs.length - 1], a = document.activeElement, inside = host.contains(a);
    if (e.shiftKey && (!inside || a === first || a.id === 'sheet-title')) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (!inside || a === last)) { e.preventDefault(); first.focus(); }
    return;

  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-a][tabindex]:not(button):not(input):not(textarea):not(select):not(a)')) { e.preventDefault(); e.target.click(); }

/* ---------- boot ---------- */
(function boot() {
  try { localStorage.removeItem(SESSION_KEY); const id = sessionStorage.getItem(SESSION_KEY); if (ACC(id)) UI.uid = id; } catch (e) { /* no stored session */ }
  render();
  const startLocal = note => { api = localBackend(); if (note) UI.storeNote = note; subscribeAll(); render(); };
  const cfg = window.FIREBASE_CONFIG;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(ns => { DL = ns || null; }).catch(() => {});
    /* No shared database here (opened while signed out of Claude, or in a view that can't run it): stop with a clear
       screen instead of quietly working on this device only, where nobody else would see the requests. */
    const noShared = () => { UI.shared = 'none'; closeSheet(); render(); };

    }).catch(() => noShared());

    if (!(cfg && cfg.apiKey && cfg.projectId) || /PASTE|YOUR[-_ ]/i.test(cfg.apiKey + cfg.projectId)) { UI.shared = 'none'; UI.offReason = 'config'; render(); return; }

      const app = window.firebase.initializeApp(cfg), dbId = cfg.firestoreDatabaseId && cfg.firestoreDatabaseId !== '(default)' ? cfg.firestoreDatabaseId : '';
      /* a named database (the one Google AI Studio creates, its ID in firestoreDatabaseId) or the project's default one */
      let fs;
      if (dbId) {
        try {
          const exp = app._delegate.container.getProvider('firestore').getImmediate({ identifier: dbId }), none = () => Promise.resolve();
          fs = new window.firebase.firestore.Firestore(app, exp, { enableIndexedDbPersistence: none, enableMultiTabIndexedDbPersistence: none, clearPersistence: none });
        } catch (e) { console.error(e); UI.fbMode = false; UI.shared = 'none'; UI.offReason = 'dbname'; render(); return; }
      } else fs = window.firebase.firestore(app);

      if (!isIOS()) { try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) { /* offline cache optional */ } }

      const PERSIST = window.__SPMS_SESSION_PERSIST ? window.firebase.auth.Auth.Persistence.SESSION : window.firebase.auth.Auth.Persistence.LOCAL;
      FB.auth.setPersistence(PERSIST).catch(() => {});
      FB.auth.onAuthStateChanged(u => { fbAuthChanged(u); });
    }).catch(e => { console.error(e); UI.fbMode = false; UI.shared = 'none'; UI.offReason = 'internet'; render(); });
  } else { UI.shared = 'standalone'; DL = window.SPMS_STANDALONE ? blobDownloads : null; startLocal(); }
})();
